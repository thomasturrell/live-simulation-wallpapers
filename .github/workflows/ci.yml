name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate changes
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check repository files and patch whitespace
        run: |
          test -s README.md
          test -s LICENSE
          git diff --check HEAD^1 HEAD

      - name: Test Game of Life and City Simulation
        run: |
          "Game of Life/Packaging/test.sh"
          "City Simulation/Packaging/test.sh"

      - name: Build and verify both native wallpaper bundles
        run: |
          LIFE_NATIVE_ARCHS="$(uname -m)" "Game of Life/NativeWallpaper/build.sh"
          CITY_NATIVE_ARCHS="$(uname -m)" "City Simulation/NativeWallpaper/build.sh"
